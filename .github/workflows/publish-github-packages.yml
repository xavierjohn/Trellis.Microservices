name: Publish to GitHub Packages

# Publishes alpha NuGet packages to GitHub Packages on manual dispatch.
# For stable nuget.org releases, use the publish-nuget-org.yml workflow instead.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for nbgv

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup versioning
        run: |
          dotnet tool install --global nbgv
          nbgv cloud

      - name: Restore dependencies
        run: dotnet restore Trellis.Microservices.slnx

      - name: Build
        run: dotnet build Trellis.Microservices.slnx --no-restore --configuration Release

      - name: Pack
        run: dotnet pack Trellis.Microservices.slnx --no-build --configuration Release --output ./dist

      - name: List packages
        run: |
          echo "Packages to be published:"
          ls -lh ./dist/*.nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push ./dist/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
